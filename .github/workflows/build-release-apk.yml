name: Build Signed Release APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-release-apk:
    name: Assemble Signed Release APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "${SDK_DIR}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${SDK_DIR}/platform-tools" >> "$GITHUB_PATH"
          if [ -x "${SDK_DIR}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${SDK_DIR}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Keystores for Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Ensure debug.keystore exists if referenced by gradle
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Prepare release keystore (use GitHub Secret if provided, otherwise generate self-signed release key)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/my-upload-key.jks"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${STORE_PASSWORD_SECRET}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PASSWORD_SECRET}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "hisabkhata2026" \
              -keypass "hisabkhata2026" \
              -dname "CN=Hisab Khata, OU=MFS Ledger, O=HisabKhata, L=Dhaka, S=Dhaka, C=BD"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=hisabkhata2026" >> $GITHUB_ENV
            echo "KEY_PASSWORD=hisabkhata2026" >> $GITHUB_ENV
          fi

      - name: Build Release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Rename and Verify Release APK
        run: |
          ls -lh app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Hisab-Khata-release.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hisab-Khata-Release-APK
          path: app/build/outputs/apk/release/Hisab-Khata-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK to GitHub Releases (on push)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          gh release create "$TAG_NAME" \
            app/build/outputs/apk/release/Hisab-Khata-release.apk \
            --title "Hisab Khata Release $TAG_NAME" \
            --notes "Automated signed release APK build for Hisab Khata (ডিজিটাল হিসাব খাতা ও MFS ব্যালেন্স ম্যানেজার)." || true
